name: JoyHobby Bandai Monitor

on:
  schedule:
    # 매일 밤 11시(KST 23:00 = UTC 14:00) 실행
    - cron: '17 12 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '강제 알림 발송 (테스트용)'
        required: false
        type: boolean
        default: false

# 상태 파일(data/last_ipgo.json)을 저장소에 자동 커밋하기 위한 쓰기 권한
permissions:
  contents: write

jobs:
  check-ipgo:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 필수 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 조이하비 반다이 입고 공지 모니터링 실행
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          CMD="python main.py"
          if [ "${{ inputs.force }}" = "true" ]; then
            CMD="$CMD --force"
          fi
          echo "실행 명령어: $CMD"
          eval $CMD

      - name: 상태 파일 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # data/last_ipgo.json 파일이 생성되었거나 변경되었을 때만 커밋
          git add data/last_ipgo.json
          if git diff --staged --quiet; then
            echo "상태 데이터에 변경사항이 없어 커밋을 건너뜁니다."
          else
            git commit -m "chore: update last ipgo state [skip ci]"
            git push
            echo "새로운 입고 상태를 저장소에 업데이트했습니다."
          fi
